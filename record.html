<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard — Audit Intelligence Platform</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sb"></aside>
  <div class="main">
    <header class="hdr"></header>
    <div class="wrap" id="page"></div>
    <footer></footer>
  </div>
</div>

<script src="data/library.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const r = rec(qs('id'));

  if (!r){
    document.getElementById('page').innerHTML =
      '<div class="snil">' + icon('i-alert') + '<b>Record not found</b>' +
      '<p>No standard matches that identifier. Try the ' +
      '<a href="frameworks.html" style="color:var(--green-3);font-weight:600">frameworks index</a>.</p></div>';
    mount({});
    return;
  }

  const f = fw(r.fw);
  document.title = r.ref + ' — ' + r.title + ' — Audit Intelligence Platform';

  /* ---- breadcrumb ---- */
  let h = '<div class="crumb">' +
    '<a href="index.html">Home</a><span class="sep">/</span>' +
    '<a href="framework.html?fw=' + esc(r.fw) + '">' + esc(f.abbr) + '</a><span class="sep">/</span>' +
    '<b>' + esc(r.ref) + '</b></div>';

  /* ---- title ---- */
  h += '<div class="ptitle">' +
    '<div class="pmark" style="background:' + f.colour + '">' + esc(f.abbr) + '</div>' +
    '<div class="pt">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px">' +
        '<span class="rref" style="font-family:ui-monospace,monospace;font-size:10px;font-weight:700;' +
        'background:var(--green);color:var(--gold);padding:3px 9px;border-radius:5px">' +
        esc(r.ref) + '</span>' +
        '<span style="font-size:10.5px;color:var(--ink-3);font-style:italic">' + esc(r.domain) + '</span>' +
      '</div>' +
      '<h1>' + esc(r.title) + '</h1>' +
      '<p>' + esc(r.summary) + '</p>' +
      '<div class="pmeta">' +
        '<span class="mtag"><b>Version</b> ' + esc(r.version) + '</span>' +
        '<span class="mtag"><b>Effective</b> ' + fmtDate(r.effective) + '</span>' +
        '<span class="mtag"><b>Updated</b> ' + fmtDate(r.updated) + '</span>' +
        tierPip(r.tier) +
      '</div>' +
    '</div></div>';

  /* ---- content + on-page nav ---- */
  h += '<div class="pcols rev"><div>';

  const sec = (id, title, ico, body, count) =>
    '<div class="rsec" id="' + id + '"><h2>' + icon(ico) + title +
    (count !== undefined ? '<span class="cnt">' + count + '</span>' : '') +
    '</h2><div class="rb">' + body + '</div></div>';

  const list = (arr, cls) =>
    '<ul class="alist ' + (cls||'') + '">' +
    arr.map(x => '<li><span>' + esc(x) + '</span></li>').join('') + '</ul>';

  /* two-column reference table: procedure/evidence, bias/description, situation/requirement */
  const twoCol = (rows, a, b, ka, kb) =>
    '<div class="tbl-wrap"><table><thead><tr><th>' + a + '</th><th>' + b +
    '</th></tr></thead><tbody>' +
    rows.map(x => '<tr><td><b>' + esc(x[ka]) + '</b></td><td>' + esc(x[kb]) +
      '</td></tr>').join('') + '</tbody></table></div>';

  /* principle overview, where the standard belongs to a principle group */
  if (r.principleOverview)
    h += sec('overview','Principle Overview','i-book','<p>' + esc(r.principleOverview) + '</p>');

  /* requirement */
  h += sec('requirement','Requirement','i-doc','<p>' + esc(r.requirement) + '</p>');

  /* engagement assignment matrix (Standard 2.2) */
  if (r.assignmentTable && r.assignmentTable.length)
    h += sec('assignment','Previous Responsibilities &amp; Engagement Assignments','i-scale',
      twoCol(r.assignmentTable,'Situation','Requirement','s','r'),
      r.assignmentTable.length);

  /* bias reference (Standard 2.1) */
  if (r.biasTable && r.biasTable.length)
    h += sec('bias','Examples of Bias','i-alert',
      twoCol(r.biasTable,'Bias','Description','b','d'), r.biasTable.length);

  /* implementation considerations */
  if (r.implementation && r.implementation.length)
    h += sec('implementation','Considerations for Implementation','i-check',
      list(r.implementation,'dot'), r.implementation.length);

  /* evidence of conformance */
  if (r.conformance && r.conformance.length)
    h += sec('conformance','Examples of Evidence of Conformance','i-doc',
      list(r.conformance,'tick'), r.conformance.length);

  /* focus areas */
  h += sec('focus','Audit Focus Areas','i-target', list(r.focus,'dot'), r.focus.length);

  /* risks */
  h += sec('risks','Risks','i-alert',
    r.risks.map(x =>
      '<div class="rrow"><div class="rt"><b>' + esc(x.r) + '</b>' +
      (x.d ? '<span>' + esc(x.d) + '</span>' : '') + '</div>' +
      '<span class="imp ' + esc(x.i) + '">' + esc(x.i) + '</span></div>').join(''),
    r.risks.length);

  /* controls */
  h += sec('controls','Controls','i-shield',
    r.controls.map(x =>
      '<div class="rrow"><div class="rt"><b>' + esc(x.c) + '</b></div>' +
      '<span class="ctype ' + esc(x.t) + '">' + esc(x.t) + '</span></div>').join(''),
    r.controls.length);

  /* procedures */
  /* where the source pairs each procedure with its required evidence, show both */
  h += sec('procedures','Audit Procedures','i-check',
    (r.procedureTable && r.procedureTable.length)
      ? twoCol(r.procedureTable,'Procedure','Required Evidence','p','e')
      : list(r.procedures),
    (r.procedureTable && r.procedureTable.length) ? r.procedureTable.length : r.procedures.length);

  /* testing */
  h += sec('testing','Testing Approach','i-grid','<p>' + esc(r.testing) + '</p>');

  /* evidence */
  h += sec('evidence','Required Evidence','i-doc', list(r.evidence,'tick'), r.evidence.length);

  /* red flags */
  h += sec('redflags','Red Flags','i-flag', list(r.redFlags,'flag'), r.redFlags.length);

  /* findings */
  h += sec('findings','Common Findings','i-grid', list(r.findings,'dot'), r.findings.length);

  /* root causes */
  h += sec('causes','Root Causes','i-layer', list(r.causes,'dot'), r.causes.length);

  /* impact */
  h += sec('impacts','Risk &amp; Impact','i-alert','<p>' + esc(r.impacts) + '</p>');

  /* recommendations */
  h += sec('recommendations','Recommendations','i-star', list(r.recommendations),
           r.recommendations.length);

  /* provenance */
  h += sec('source','Source &amp; Provenance','i-scale',
    '<div class="srcbox"><dl>' +
      '<dt>Source</dt><dd>' + esc(r.source) + '</dd>' +
      '<dt>Framework</dt><dd>' + esc(f.name) + '</dd>' +
      '<dt>Reference</dt><dd>' + esc(r.ref) + '</dd>' +
      '<dt>Version</dt><dd>' + esc(r.version) + '</dd>' +
      '<dt>Effective</dt><dd>' + fmtDate(r.effective) + '</dd>' +
      '<dt>Last updated</dt><dd>' + fmtDate(r.updated) + '</dd>' +
      '<dt>Content held</dt><dd>' + (r.tier === 'open'
        ? 'Open licence — full text may be held'
        : 'Structured reference and original guidance only') + '</dd>' +
      '<dt>Official</dt><dd><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' +
        esc(r.url.replace(/^https?:\/\//,'')) + ' &#8599;</a></dd>' +
    '</dl></div>' +
    (r.references.length
      ? '<div style="margin-top:13px"><div style="font-size:9px;letter-spacing:.12em;' +
        'text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px">' +
        'Professional references</div><ul class="alist dot">' +
        r.references.map(x => '<li><span>' + esc(x.t) +
          ' — <a href="' + esc(x.u) + '" target="_blank" rel="noopener noreferrer" ' +
          'style="color:var(--green-3);font-weight:600">official source &#8599;</a></span></li>').join('') +
        '</ul></div>'
      : ''));

  /* tags */
  h += '<div class="rsec"><h2>' + icon('i-filter') + 'Tags</h2><div class="rb">' +
    '<div class="tchips" style="padding-top:0;border-top:0">' +
    r.tags.map(t => '<a href="framework.html?fw=' + encodeURIComponent(r.fw) + '" title="Search ' + esc(fw(r.fw).abbr) + ' for this tag">' +
      '<span style="cursor:pointer">' + esc(t) + '</span></a>').join('') +
    '</div></div></div>';

  h += '</div>';

  /* on-page nav */
  const navItems = [];
  if (r.principleOverview) navItems.push(['overview','Principle Overview']);
  navItems.push(['requirement','Requirement']);
  if (r.assignmentTable && r.assignmentTable.length) navItems.push(['assignment','Assignments']);
  if (r.biasTable && r.biasTable.length) navItems.push(['bias','Examples of Bias']);
  if (r.implementation && r.implementation.length) navItems.push(['implementation','Implementation']);
  if (r.conformance && r.conformance.length) navItems.push(['conformance','Conformance Evidence']);

  h += '<aside class="rnav"><div class="ph">On This Page</div>' +
    navItems.concat([
      ['focus','Focus Areas'],['risks','Risks'],
      ['controls','Controls'],['procedures','Procedures'],['testing','Testing'],
      ['evidence','Evidence'],['redflags','Red Flags'],['findings','Findings'],
      ['causes','Root Causes'],['impacts','Risk &amp; Impact'],
      ['recommendations','Recommendations'],['source','Source']
    ]).map(x => '<a href="#' + x[0] + '">' + x[1] + '</a>').join('') +
    '</aside>';

  h += '</div>';

  /* related records in the same framework */
  const sibs = RECORDS.filter(x => x.fw === r.fw && x.id !== r.id);
  if (sibs.length){
    h += '<section style="margin-top:6px"><div class="sec-h"><h2>More in ' + esc(f.abbr) + '</h2>' +
      '<a href="framework.html?fw=' + esc(r.fw) + '" class="more">All ' + esc(f.abbr) +
      ' ' + icon('i-arrow') + '</a></div><div class="rlist" style="margin-top:12px">';
    sibs.forEach(s => {
      h += '<a class="rcard" href="record.html?id=' + encodeURIComponent(s.id) + '">' +
        '<div class="rh"><span class="rref">' + esc(s.ref) + '</span>' +
        '<h3>' + esc(s.title) + '</h3></div>' +
        '<p class="rsum">' + esc(s.summary) + '</p></a>';
    });
    h += '</div></section>';
  }

  document.getElementById('page').innerHTML = h;
  mount({ active: r.fw });
})();
</script>
</body>
</html>
