<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework — Audit Intelligence Platform</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sb"></aside>
  <div class="main">
    <header class="hdr"></header>
    <div class="wrap" id="page"></div>
    <footer></footer>
  </div>
</div>

<script src="data/library.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const id = qs('fw') || 'iia';
  const f  = fw(id);

  if (!f){
    document.getElementById('page').innerHTML =
      '<div class="snil">' + icon('i-alert') +
      '<b>Framework not found</b><p>No framework matches that identifier. ' +
      'Return to the <a href="index.html" style="color:var(--green-3);font-weight:600">homepage</a> ' +
      'or browse <a href="frameworks.html" style="color:var(--green-3);font-weight:600">all frameworks</a>.</p></div>';
    mount({});
    return;
  }

  document.title = f.abbr + ' — ' + f.name + ' — Audit Intelligence Platform';

  const recs = RECORDS.filter(r => r.fw === id);

  /* ---- breadcrumb + title ---- */
  let h = '<div class="crumb">' +
    '<a href="index.html">Home</a><span class="sep">/</span>' +
    '<a href="frameworks.html">Standards &amp; Frameworks</a><span class="sep">/</span>' +
    '<b>' + esc(f.abbr) + '</b></div>';

  h += '<div class="ptitle">' +
    '<div class="pmark" style="background:' + f.colour + '">' + esc(f.abbr) + '</div>' +
    '<div class="pt">' +
      '<h1>' + esc(f.name) + '</h1>' +
      '<p>' + esc(f.blurb) + '</p>' +
      '<div class="pmeta">' +
        '<span class="mtag"><b>Issuer</b> ' + esc(f.body) + '</span>' +
        '<span class="mtag"><b>Version</b> ' + esc(f.version) + '</span>' +
        '<span class="mtag"><b>Effective</b> ' + fmtDate(f.effective) + '</span>' +
        '<span class="mtag"><b>Updated</b> ' + fmtDate(f.updated) + '</span>' +
        (f.cert ? '<span class="mtag"><b>Certification</b> ' + esc(f.cert) + '</span>' : '') +
        '<span class="stat-b ' + esc(f.status||'Current') + '">' + esc(f.status||'Current') + '</span>' +
        tierPip(f.tier) +
      '</div>' +
    '</div></div>';

  /* ---- two column: framework sidebar + record list ---- */
  h += '<div class="pcols">';

  /* framework-specific sidebar — the per-framework nav she asked for */
  h += '<aside class="pside"><div class="ph">' + esc(f.abbr) + ' Sections</div>';
  const sections = [
    ['overview','Overview','i-book'],
    ['standards','Standards &amp; Guidance','i-doc'],
    ['focus','Audit Focus Areas','i-target'],
    ['risks','Risks','i-alert'],
    ['controls','Controls','i-shield'],
    ['procedures','Audit Procedures','i-check'],
    ['redflags','Red Flags','i-flag'],
    ['findings','Common Findings','i-grid'],
    ['refs','Professional References','i-link']
  ];
  sections.forEach((s,i) => {
    h += '<a href="#' + s[0] + '"' + (i===0 ? ' class="on"' : '') + '>' +
         icon(s[2]) + s[1] + '</a>';
  });
  h += '</aside>';

  /* main column */
  h += '<div>';

  /* Shown only if a framework is added through the CMS before any record
     has been created for it. Every framework shipped with the platform
     carries content, so this state is not normally reachable. */
  if (!recs.length){
    h += '<div class="rsec" id="overview"><h2>' + icon('i-book') + 'Overview</h2>' +
      '<div class="rb"><p>' + esc(f.blurb) + '</p>' +
      '<p style="margin-top:10px"><b>Issuing body.</b> ' + esc(f.body) + '. ' +
      'Version ' + esc(f.version) + ', effective ' + fmtDate(f.effective) + '.</p></div></div>';
    h += '<div class="rsec"><h2>' + icon('i-doc') + 'Standards &amp; Guidance</h2>' +
      '<div class="rb"><div class="snil" style="padding:34px 16px">' + icon('i-doc') +
      '<b>No records yet in this section</b><p>This framework has been created but no ' +
      'standards have been added to it. Records can be added through the ' +
      '<a href="admin.html" style="color:var(--green-3);font-weight:600">Admin / CMS</a>.</p>' +
      '</div></div></div>';
  } else {
    h += '<div class="rsec" id="overview"><h2>' + icon('i-book') + 'Overview</h2>' +
      '<div class="rb"><p>' + esc(f.blurb) + '</p>' +
      '<p><b>Issuing body.</b> ' + esc(f.body) + '. Current version ' + esc(f.version) +
      ', effective ' + fmtDate(f.effective) + '. Records in this section were last reviewed ' +
      fmtDate(f.updated) + '.</p></div></div>';

    h += '<div class="rsec" id="standards"><h2>' + icon('i-doc') + 'Standards &amp; Guidance' +
         '<span class="cnt">' + recs.length + ' records</span></h2>' +
         '<div class="rb">';

    /* ---- search scoped to THIS framework only ---- */
    h += '<div class="modsearch-box">' +
      '<label class="sbig sbig-sm">' + icon('i-search','si') +
        '<input type="search" id="fwq" placeholder="Search within ' + esc(f.abbr) + ' only…" ' +
        'aria-label="Search within ' + esc(f.abbr) + '">' +
      '</label>' +
      '<div class="modscope">' + icon('i-shield') +
        '<span>Searches <b>' + esc(f.abbr) + '</b> only — not other frameworks, not the internet.</span>' +
      '</div>' +
      '<div id="fwresults"></div>' +
    '</div>';

    h += '<div class="rlist" id="fwlist">';

    recs.forEach(r => {
      h += '<a class="rcard" href="record.html?id=' + encodeURIComponent(r.id) + '">' +
        '<div class="rh"><span class="rref">' + esc(r.ref) + '</span>' +
        '<h3>' + esc(r.title) + '</h3></div>' +
        '<div class="rdom">' + esc(r.domain) + '</div>' +
        '<p class="rsum">' + esc(r.summary) + '</p>' +
        '<div class="rfoot">' +
          '<span class="pip">' + r.risks.length + ' risks</span>' +
          '<span class="pip">' + r.controls.length + ' controls</span>' +
          '<span class="pip">' + r.procedures.length + ' procedures</span>' +
          '<span class="pip r">' + r.redFlags.length + ' red flags</span>' +
          '<span class="pip" style="margin-left:auto">Updated ' + fmtDate(r.updated) + '</span>' +
        '</div></a>';
    });

    h += '</div>';
    h += '</div></div>';

    /* aggregated cross-record sections */
    const agg = (key, title, ico, cls, id2) => {
      const items = [];
      recs.forEach(r => (r[key]||[]).forEach(v => items.push({ v, r })));
      if (!items.length) return '';
      let s = '<div class="rsec" id="' + id2 + '"><h2>' + icon(ico) + title +
              '<span class="cnt">' + items.length + ' across ' + recs.length + ' records</span></h2>' +
              '<div class="rb"><ul class="alist ' + cls + '">';
      items.forEach(it => {
        const txt = typeof it.v === 'string' ? it.v : (it.v.r || it.v.c);
        s += '<li><span>' + esc(txt) +
             ' <a href="record.html?id=' + encodeURIComponent(it.r.id) + '" ' +
             'style="color:var(--green-3);font-weight:600;font-size:10.5px;white-space:nowrap">' +
             esc(it.r.ref) + ' &rsaquo;</a></span></li>';
      });
      return s + '</ul></div></div>';
    };

    h += agg('focus','Audit Focus Areas','i-target','dot','focus');
    h += agg('risks','Risks','i-alert','flag','risks');
    h += agg('controls','Controls','i-shield','tick','controls');
    h += agg('procedures','Audit Procedures','i-check','','procedures');
    h += agg('redFlags','Red Flags','i-flag','flag','redflags');
    h += agg('findings','Common Findings','i-grid','dot','findings');

    /* references */
    const refs = [];
    recs.forEach(r => (r.references||[]).forEach(x => {
      if (!refs.some(y => y.u === x.u && y.t === x.t)) refs.push(x);
    }));
    if (refs.length){
      h += '<div class="rsec" id="refs"><h2>' + icon('i-link') + 'Professional References' +
           '<span class="cnt">' + refs.length + '</span></h2><div class="rb"><ul class="alist dot">';
      refs.forEach(x => {
        h += '<li><span>' + esc(x.t) + ' — <a href="' + esc(x.u) + '" target="_blank" ' +
             'rel="noopener noreferrer" style="color:var(--green-3);font-weight:600">' +
             'official source &#8599;</a></span></li>';
      });
      h += '</ul></div></div>';
    }
  }

  /* provenance */
  h += '<div class="rsec"><h2>' + icon('i-scale') + 'Source &amp; Licensing</h2><div class="rb">' +
    '<div class="srcbox"><dl>' +
      '<dt>Source</dt><dd>' + esc(f.body) + '</dd>' +
      '<dt>Framework</dt><dd>' + esc(f.name) + '</dd>' +
      '<dt>Version</dt><dd>' + esc(f.version) + '</dd>' +
      '<dt>Effective</dt><dd>' + fmtDate(f.effective) + '</dd>' +
      '<dt>Last updated</dt><dd>' + fmtDate(f.updated) + '</dd>' +
      '<dt>Content held</dt><dd>' + (f.tier === 'open'
        ? 'Open licence — full text may be held'
        : 'Structured reference and original guidance only') + '</dd>' +
      '<dt>Official</dt><dd><a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer">' +
        esc(f.url.replace(/^https?:\/\//,'')) + ' &#8599;</a></dd>' +
    '</dl></div></div></div>';

  h += '</div></div>';

  document.getElementById('page').innerHTML = h;
  mount({ active: id, searchLabel: f.abbr });

  /* ---- in-section search: restricted to this framework ---- */
  const fwq = document.getElementById('fwq');
  if (fwq){
    const list = document.getElementById('fwlist');
    const out  = document.getElementById('fwresults');
    let t;
    const run = () => {
      const q = fwq.value.trim();
      if (!q){ out.innerHTML = ''; list.style.display = ''; return; }
      list.style.display = 'none';
      // opts.fw pins the query to this framework — nothing else is searched
      const res = search(q, { fw: id }).filter(x => x.type === 'record');
      if (!res.length){
        out.innerHTML = '<div class="snil" style="padding:32px 16px">' + icon('i-search') +
          '<b>No match in ' + esc(f.abbr) + '</b><p>No record in this section matches ' +
          '&ldquo;' + esc(q) + '&rdquo;. This search covers ' + esc(f.abbr) +
          ' only, as configured.</p></div>';
        return;
      }
      out.innerHTML = '<div class="scount" style="margin:4px 0 11px"><b>' + res.length +
        '</b> match' + (res.length === 1 ? '' : 'es') + ' in ' + esc(f.abbr) + '</div>' +
        '<div class="rlist">' + res.map(x => {
          const r = x.r;
          return '<a class="rcard" href="record.html?id=' + encodeURIComponent(r.id) + '">' +
            '<div class="rh"><span class="rref">' + esc(r.ref) + '</span>' +
            '<h3>' + highlight(r.title, q) + '</h3></div>' +
            '<p class="rsum">' + highlight(snippet(r, q), q) + '</p>' +
            '<div class="rfoot">' + x.hits.slice(0,4).map(fl =>
              '<span class="pip">in ' + esc(fl.replace(/([A-Z])/g,' $1').toLowerCase()) + '</span>'
            ).join('') + '</div></a>';
        }).join('') + '</div>';
    };
    fwq.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 140); });
    fwq.addEventListener('keydown', e => { if (e.key === 'Enter'){ clearTimeout(t); run(); } });
  }

  /* sidebar scroll-spy */
  const links = [...document.querySelectorAll('.pside a')];
  const secs  = links.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
  if (secs.length){
    const spy = new IntersectionObserver(es => {
      es.forEach(e => {
        if (e.isIntersecting){
          links.forEach(l => l.classList.toggle('on',
            l.getAttribute('href') === '#' + e.target.id));
        }
      });
    }, { rootMargin:'-80px 0px -70% 0px' });
    secs.forEach(s => spy.observe(s));
  }
})();
</script>
</body>
</html>
