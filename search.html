<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Audit Intelligence Platform</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="sb"></aside>
  <div class="main">
    <header class="hdr"></header>
    <div class="wrap">
      <div class="crumb">
        <a href="index.html">Home</a><span class="sep">/</span><b>Global Search</b>
      </div>

      <div>
        <label class="sbig">
          <svg class="si" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" fill="none"/><path d="M17 17l-4-4" fill="none"/></svg>
          <input type="search" id="q" autofocus
                 placeholder="Search standards, risks, controls, procedures, red flags, findings…"
                 aria-label="Search the library">
        </label>
        <div class="sfilt" id="filters"></div>
      </div>

      <div id="results"></div>
    </div>
    <footer></footer>
  </div>
</div>

<script src="data/library.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  const input   = document.getElementById('q');
  const out     = document.getElementById('results');
  const filters = document.getElementById('filters');
  let activeFw  = '';

  /* framework filter buttons — only those with content, plus All */
  const withContent = FRAMEWORKS.filter(f => RECORDS.some(r => r.fw === f.id));
  filters.innerHTML =
    '<button class="fb on" data-fw="">All frameworks</button>' +
    withContent.map(f =>
      '<button class="fb" data-fw="' + f.id + '">' + esc(f.abbr) + '</button>').join('');

  filters.addEventListener('click', e => {
    const b = e.target.closest('.fb');
    if (!b) return;
    activeFw = b.dataset.fw;
    filters.querySelectorAll('.fb').forEach(x => x.classList.toggle('on', x === b));
    run();
  });

  /* suggestions shown before any query is typed */
  const SUGGEST = ['segregation of duties','beneficial ownership','management override',
                   'risk appetite','root cause','journal entries','fraud red flags',
                   'customer due diligence','audit evidence'];

  function idle(){
    out.innerHTML =
      '<div class="scount" style="margin:18px 0 11px">Suggested searches</div>' +
      '<div class="sfilt" style="margin:0">' +
      SUGGEST.map(s => '<button class="fb" data-go="' + esc(s) + '">' + esc(s) + '</button>').join('') +
      '</div>' +
      '<div class="snil" style="padding-top:38px">' + icon('i-search') +
      '<b>Search the whole library at once</b>' +
      '<p>One query searches every framework — across standards, requirements, focus areas, ' +
      'risks, controls, procedures, testing, evidence, red flags, findings, root causes ' +
      'and recommendations.</p></div>';

    out.querySelectorAll('[data-go]').forEach(b =>
      b.addEventListener('click', () => {
        input.value = b.dataset.go;
        run();
        input.focus();
      }));
  }

  function run(){
    const q = input.value.trim();

    /* keep the URL shareable */
    const u = new URL(location.href);
    if (q) u.searchParams.set('q', q); else u.searchParams.delete('q');
    history.replaceState(null, '', u);

    if (!q){ idle(); return; }

    const res = search(q, activeFw ? { fw: activeFw } : {});

    if (!res.length){
      out.innerHTML = '<div class="snil" style="padding-top:44px">' + icon('i-search') +
        '<b>No results for &ldquo;' + esc(q) + '&rdquo;</b>' +
        '<p>Try a broader term, or search for a concept rather than an exact phrase — ' +
        'for example &ldquo;override&rdquo; rather than &ldquo;management override of controls&rdquo;. ' +
        'Content for the remaining frameworks is scheduled for Week 2.</p></div>';
      return;
    }

    const recN = res.filter(x => x.type === 'record').length;
    let h = '<div class="scount" style="margin:18px 0 11px">' +
      '<b>' + res.length + '</b> result' + (res.length === 1 ? '' : 's') +
      ' for &ldquo;' + esc(q) + '&rdquo;' +
      (activeFw ? ' in <b>' + esc(fw(activeFw).abbr) + '</b>' : '') +
      (recN ? '<span class="sep">·</span>' + recN + ' standard' + (recN===1?'':'s') : '') +
      '</div>';

    h += '<div class="rlist">';

    res.forEach(x => {
      if (x.type === 'record'){
        const r = x.r, f = fw(r.fw);
        h += '<a class="rcard" href="record.html?id=' + encodeURIComponent(r.id) + '">' +
          '<div class="rh">' +
            '<span class="rref" style="background:' + f.colour + '">' + esc(f.abbr) + '</span>' +
            '<span class="rref">' + esc(r.ref) + '</span>' +
            '<h3>' + highlight(r.title, q) + '</h3></div>' +
          '<p class="rsum">' + highlight(snippet(r, q), q) + '</p>' +
          '<div class="rfoot">' +
            x.hits.slice(0,5).map(fl =>
              '<span class="pip">matched in ' + esc(fl.replace(/([A-Z])/g,' $1').toLowerCase()) + '</span>'
            ).join('') +
            '<span class="pip" style="margin-left:auto">' + fmtDate(r.updated) + '</span>' +
          '</div></a>';
      }
      else if (x.type === 'framework'){
        const f = x.f;
        h += '<a class="rcard" href="framework.html?fw=' + esc(f.id) + '">' +
          '<div class="rh">' +
            '<span class="rref" style="background:' + f.colour + '">' + esc(f.abbr) + '</span>' +
            '<h3>' + highlight(f.name, q) + '</h3></div>' +
          '<p class="rsum">' + highlight(f.blurb, q) + '</p>' +
          '<div class="rfoot"><span class="pip">Framework</span>' +
            '<span class="pip">' + f.count + ' records</span>' +
            tierPip(f.tier) + '</div></a>';
      }
      else {
        const t = x.t;
        h += '<a class="rcard" href="tools.html#' + esc(t.id) + '">' +
          '<div class="rh"><span class="rref">TOOL</span>' +
          '<h3>' + highlight(t.name, q) + '</h3></div>' +
          '<p class="rsum">' + highlight(t.desc, q) + '</p>' +
          '<div class="rfoot"><span class="pip">Practical tool</span>' +
          '<span class="pip">' + t.count + ' items</span></div></a>';
      }
    });

    h += '</div>';

    h += '<div class="disc" style="margin-top:15px"><b>Demo search scope.</b> ' +
      'Search currently covers the populated frameworks — IIA, COSO, FATF and ERM — ' +
      'plus all framework and tool listings. Remaining frameworks are scheduled for ' +
      'population in Week 2, at which point they enter the same index.</div>';

    out.innerHTML = h;
  }

  /* debounce typing */
  let t;
  input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 140); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ clearTimeout(t); run(); } });

  /* seed from ?q= */
  const seed = qs('q');
  if (seed){ input.value = seed; run(); } else idle();

  mount({ active:'searchp', q: seed });

  /* Ctrl/Cmd-K focuses search from anywhere on the page */
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault(); input.focus(); input.select();
    }
  });
})();
</script>
</body>
</html>
