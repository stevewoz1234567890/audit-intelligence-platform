<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Internal Audit Standards — Audit Intelligence</title>
<link rel="stylesheet" href="assets/iia.css">
</head>
<body>

<header class="top"></header>

<div class="shell">
  <aside class="nav"></aside>
  <div class="main">
    <div class="crumb">
      <a href="index.html">Home</a><span class="sep">/</span><b>IIA Standards</b>
    </div>
    <div class="page-h">
      <div class="eyebrow">Professional framework</div>
      <h1>Global Internal Audit Standards</h1>
      <p id="lede">Explore the framework by Domain, Principle and Standard.</p>
      <div class="statrow" id="statrow"></div>
      <form class="searchline" id="searchForm">
        <input type="search" id="q" placeholder="Search all Standards and guidance…"
               aria-label="Search the standards" autofocus>
        <button class="btn-gold" type="submit">Search</button>
      </form>
    </div>
    <div id="out"></div>
    <div style="padding:8px 32px 28px">
      <div class="askbar" style="max-width:none;margin:0">
        <div class="ai-i"><svg class="ic" viewBox="0 0 20 20"><path d="M10 2.5l1.7 4.3 4.3 1.7-4.3 1.7L10 14.5 8.3 10.2 4 8.5l4.3-1.7z"/></svg></div>
        <div>
          <b>Need help finding guidance?</b>
          <span>Ask the AI Assistant. It answers from the standards in this platform.</span>
        </div>
        <a class="btn-gold" href="assistant.html">Ask AI Assistant</a>
      </div>
    </div>
    <footer></footer>
  </div>
</div>

<script src="data/library.js"></script>
<script src="data/iia.js"></script>
<script src="assets/iia.js"></script>
<script>
(function(){
  const input = document.getElementById('q');
  const out = document.getElementById('out');
  const lede = document.getElementById('lede');
  const st = contentStats();
  document.getElementById('statrow').innerHTML =
    '<div><b>' + st.domains + '</b><span>Domains</span></div>' +
    '<div><b>' + st.principles + '</b><span>Principles</span></div>' +
    '<div><b>' + st.standards + '</b><span>Standards</span></div>';

  function span(d){
    if (!d.principles.length) return 'Purpose statement';
    const nums = d.principles.map(p => p.num);
    const a = Math.min.apply(null, nums), b = Math.max.apply(null, nums);
    return a === b ? 'Principle ' + a : 'Principles ' + a + '–' + b;
  }

  function card(d){
    return '<a class="tcard" href="standards.html?domain=' + encodeURIComponent(d.id) + '">' +
      '<div class="kicker">Domain ' + esc(d.num) + '</div>' +
      '<h3>' + esc(d.name) + '</h3>' +
      '<p>' + esc(d.blurb) + '</p>' +
      '<span class="go">Explore Domain</span></a>';
  }

  function domains(){
    lede.textContent = 'Explore the framework by Domain, Principle and Standard.';
    const top = DOMAINS.slice(0, 2).map(card).join('');
    const rest = DOMAINS.slice(2).map(card).join('');
    out.innerHTML = '<div class="catalog"><div class="group-label">Explore the five Domains</div>' +
      '<div class="cgrid two">' + top + '</div>' +
      '<div class="cgrid" style="margin-top:14px">' + rest + '</div></div>';
  }

  function domainView(id){
    const d = DOMAINS.find(x => x.id === id);
    if (!d){ domains(); return; }
    lede.textContent = 'Domain ' + d.num + ' — ' + d.name + '. ' + span(d) + '.';
    let h = '<div class="catalog"><a class="go" href="standards.html" style="font-weight:700;color:var(--navy)">All domains</a>';
    h += '<div class="group-label">Domain ' + esc(d.num) + '</div>';
    h += '<div class="tcard" style="margin-bottom:16px"><div class="kicker">' + esc(span(d)) + '</div>' +
      '<h3>' + esc(d.name) + '</h3><p>' + esc(d.blurb) + '</p></div>';
    if (!d.principles.length){
      h += '<div class="sheet"><p>Domain I is the purpose of internal auditing. It states why the function exists and the value it provides to the organisation. It has no numbered principles. The principles and standards begin in Domain II, Ethics and Professionalism.</p>' +
        '<p style="margin-top:10px">The purpose statement is published by the Institute of Internal Auditors. Read the authoritative text at ' +
        '<a href="https://www.theiia.org/en/standards/2024-standards/global-internal-audit-standards/" target="_blank" rel="noopener noreferrer">theiia.org</a>.</p></div>';
    }
    d.principles.forEach(p => {
      h += '<div class="group-label">Principle ' + p.num + ' — ' + esc(p.title) + '</div><div class="cgrid">';
      p.standards.forEach(s => {
        const rec = standardRecord(s.ref);
        h += '<a class="tcard" href="standard.html?ref=' + encodeURIComponent(s.ref) + '">' +
          '<div class="kicker">Standard ' + esc(s.ref) + '</div><h3>' + esc(s.title) + '</h3>' +
          '<p>' + (rec ? esc(rec.summary) : 'Open the standard.') + '</p>' +
          '<span class="go">' + (rec ? 'Open standard' : 'View standard') + '</span></a>';
      });
      h += '</div>';
    });
    out.innerHTML = h + '</div>';
  }

  function run(){
    const q = input.value.trim();
    const url = new URL(location.href);
    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
    history.replaceState(null, '', url);
    if (!q){
      const domain = qs('domain');
      if (domain) domainView(domain); else domains();
      return;
    }
    lede.textContent = 'Results are limited to the standards held in this platform.';
    let res = searchPlatform(q);
    const domain = qs('domain');
    if (domain) res = res.filter(r => r.s.domainId === domain);
    if (!res.length){
      out.innerHTML = '<div class="empty"><b>No results for “' + esc(q) + '”</b>' +
        '<p>Try a keyword, a topic, or a standard number such as 2.2. This search reads the content of the standards, not the internet.</p></div>';
      return;
    }
    let h = '<div class="results">';
    res.forEach(r => {
      const s = r.s;
      const href = 'standard.html?ref=' + encodeURIComponent(s.ref);
      const src = (r.hits[0] && r.hits[0].text) || (r.rec && r.rec.summary) || '';
      h += '<a class="hit" href="' + href + (r.hits[0] ? '#' + r.hits[0].anchor : '') + '">' +
        '<span class="sref">' + esc(s.ref) + '</span><h3>' + highlight(s.title, q) + '</h3>' +
        '<p>' + esc('Domain ' + s.domainId + ' · Principle ' + s.principleNum) +
        (src ? ' — ' + highlight(preview(src, q), q) : '') + '</p></a>';
    });
    out.innerHTML = h + '</div>';
  }

  let timer;
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 130); });
  document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); run(); });
  const seed = qs('q');
  if (seed){ input.value = seed; run(); } else run();
  mount({ active:'library' });
})();
</script>
</body>
</html>
