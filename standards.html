<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Internal Audit Standards — Audit Intelligence</title>
<link rel="stylesheet" href="assets/iia.css?v=13">
</head>
<body>

<header class="top"></header>

<div class="shell">
  <aside class="nav"></aside>
  <div class="main">
    <div class="crumb">
      <a href="index.html">Home</a><span class="sep">/</span><b>IIA Standards</b>
    </div>
    <div class="page-h" id="domain-i-intro">
      <div class="eyebrow">Professional framework</div>
      <h1>Global Internal Audit Standards</h1>
      <p id="lede">Explore the framework by Domain, Principle and Standard.</p>
      <div class="statrow" id="statrow"></div>
      <form class="searchline" id="searchForm">
        <input type="search" id="q" placeholder="Search all Standards and guidance…"
               aria-label="Search the standards" autofocus>
        <button class="btn-gold" type="submit">Search</button>
      </form>
    </div>
    <div id="out"></div>
    <div style="padding:8px 32px 28px">
      <div class="askbar" id="pageAsk" style="max-width:none;margin:0">
        <div class="ai-i"><svg class="ic" viewBox="0 0 20 20"><path d="M10 2.5l1.7 4.3 4.3 1.7-4.3 1.7L10 14.5 8.3 10.2 4 8.5l4.3-1.7z"/></svg></div>
        <div>
          <b>Need help finding guidance?</b>
          <span>Ask the AI Assistant. It answers from the standards in this platform.</span>
        </div>
        <a class="btn-gold" href="assistant.html">Ask AI Assistant →</a>
      </div>
    </div>
    <footer></footer>
  </div>
</div>

<script src="data/library.js"></script>
<script src="data/supplied-standards.js"></script>
<script src="data/supplied-tables.js"></script>
<script src="data/iia.js?v=9"></script>
<script src="data/references.js"></script>
<script src="assets/iia.js?v=11"></script>
<script>
(function(){
  const input = document.getElementById('q');
  const out = document.getElementById('out');
  const lede = document.getElementById('lede');
  const st = contentStats();
  document.getElementById('statrow').innerHTML =
    '<div><b>' + st.domains + '</b><span>Domains</span></div>' +
    '<div><b>' + st.principles + '</b><span>Principles</span></div>' +
    '<div><b>' + st.standards + '</b><span>Standards</span></div>';

  function span(d){
    if (!d.principles.length) return 'Purpose statement';
    const nums = d.principles.map(p => p.num);
    const a = Math.min.apply(null, nums), b = Math.max.apply(null, nums);
    return a === b ? 'Principle ' + a : 'Principles ' + a + '–' + b;
  }

  function card(d){
    return '<a class="tcard" href="standards.html?domain=' + encodeURIComponent(d.id) + '">' +
      '<div class="kicker">Domain ' + esc(d.num) + '</div>' +
      '<h3>' + esc(d.name) + '</h3>' +
      '<p>' + esc(d.blurb) + '</p>' +
      '<span class="go">Explore Domain</span></a>';
  }

  function diItem(item){
    return '<div class="di-item">' + icon(item.icon || 'check') +
      '<div><b>' + esc(item.title) + '</b><span>' + esc(item.text) + '</span></div></div>';
  }

  function psList(items){
    return '<ul class="rq dot">' + items.map(x => '<li><span>' + esc(x) + '</span></li>').join('') + '</ul>';
  }
  function psItems(items, symbol){
    return '<div class="di-item-list">' + items.map(x => '<div class="di-item">' + icon(symbol) +
      '<div><b>' + esc(x.title) + '</b><span>' + esc(x.text) + '</span></div></div>').join('') + '</div>';
  }
  function psPanel(title, content, cls){
    return '<section class="ps-panel' + (cls ? ' ' + cls : '') + '"><h4>' + esc(title) + '</h4>' + content + '</section>';
  }
  function psArea(id, title, data, symbol){
    const parts = [psPanel('Application Considerations', data.text.map(x => '<p>' + esc(x) + '</p>').join('') +
      psItems(data.subtopics, symbol) + (data.arrangements ? '<h5>Examples of Governance Arrangements</h5>' + psItems(data.arrangements, 'users') : '')),
      psPanel('Audit Focus Areas', psList(data.focus)),
      psPanel('Risks', psItems(data.risks, 'alert')),
      psPanel('Suggested Controls', psList(data.controls)),
      psPanel('Audit Procedures', psList(data.procedures)),
      psPanel('Evidence', data.evidence && data.evidence.length ? psList(data.evidence) :
        '<p>Document the records examined and conclusions reached for each audit procedure. The supplied content combines suggested audit procedures and required evidence; it does not provide a separate evidence list for this area.</p>'),
      psPanel('Red Flags', psList(data.redFlags)),
      psPanel('Illustrative Findings', psList(data.findings))];
    return '<section class="ps-view" id="' + id + '" role="tabpanel" aria-labelledby="tab-' + id + '" hidden>' +
      '<h2 class="ps-area-title">' + icon(symbol) + esc(title) + '</h2><div class="ps-area-grid">' + parts.join('') + '</div></section>';
  }
  function publicSectorPanel(){
    const o = PUBLIC_SECTOR.overview;
    const cards = [
      { title:'Laws & Regulations', text:o.applicationAreas[0].text, id:'ps-laws', icon:'scale', action:'Explore Legal Considerations' },
      { title:'Governance & Structure', text:o.applicationAreas[1].text, id:'ps-governance', icon:'hierarchy', action:'Explore Governance' },
      { title:'Funding', text:o.applicationAreas[2].text, id:'ps-funding', icon:'coins', action:'Explore Funding' }
    ];
    const refs = '<div class="ps-table-wrap"><table class="ps-table"><thead><tr><th scope="col">Standard</th><th scope="col">Title</th><th scope="col">Relevance to Public Sector Application</th></tr></thead><tbody>' +
      PUBLIC_SECTOR.references.map(x => '<tr><td><a href="standard.html?ref=' + encodeURIComponent(x.ref) + '">Standard ' + esc(x.ref) + '</a></td><td>' + esc(x.title) + '</td><td>' + esc(x.connection) + '</td></tr>').join('') + '</tbody></table></div>';
    return '<div class="di public-sector"><div class="ps-heading">' +
      '<p class="ps-source-link"><a href="assets/standards/public-sector.pdf" target="_blank" rel="noopener noreferrer">View the supplied Public Sector PDF ↗</a></p>' +
      '<div class="di-tabs" role="tablist" aria-label="Public Sector Application sections">' +
      PUBLIC_SECTOR.sections.map((x,i) => '<button type="button" class="di-tab' + (i ? '' : ' on') + '" role="tab" id="tab-' + x.id + '" aria-controls="' + x.id + '" aria-selected="' + !i + '" tabindex="' + (i ? '-1' : '0') + '" data-ps-tab="' + x.id + '">' + esc(x.label) + '</button>').join('') + '</div></div>' +
      '<section class="ps-view" id="ps-overview" role="tabpanel" aria-labelledby="tab-ps-overview">' +
        psPanel('Applying the Standards in Context', '<p>' + esc(o.intro) + '</p><p>' + esc(o.detail) + '</p><p>' + esc(o.note) + '</p>', 'ps-intro') +
        '<div class="ps-cards">' + cards.map(x => '<article class="ps-card">' + icon(x.icon) + '<div class="ps-card-content"><h3>' + esc(x.title) + '</h3><p>' + esc(x.text) + '</p>' +
          '<button type="button" class="ps-explore" data-ps-tab="' + x.id + '">' + esc(x.action) + ' ' + icon('arrow') + '</button></div></article>').join('') + '</div>' +
        '<div class="ps-lower">' + psPanel('Public Sector Audit Priorities', psList(o.priorities)) +
        psPanel('Within Each Application Area', psList(['Standards Application','Audit Focus Areas','Risks & Suggested Controls','Audit Procedures & Evidence','Red Flags','Illustrative Findings'])) + '</div></section>' +
      psArea('ps-laws','Laws & Regulations', PUBLIC_SECTOR.laws, 'scale') +
      psArea('ps-governance','Governance & Structure', PUBLIC_SECTOR.governance, 'hierarchy') +
      psArea('ps-funding','Funding', PUBLIC_SECTOR.funding, 'coins') +
      '<section class="ps-view" id="ps-references" role="tabpanel" aria-labelledby="tab-ps-references" hidden><h2 class="ps-area-title">Professional References</h2>' + refs + '</section></div>';
  }

  function domainIPanel(){
    const value = DOMAIN_I.howValueProvides.map(item =>
      '<article class="di-v">' + icon(item.icon || 'shield') +
      '<h3>' + esc(item.title) + '</h3><p>' + esc(item.short || item.text) + '</p></article>').join('');
    const enhances = DOMAIN_I.enhances.map(diItem).join('');
    const conditions = DOMAIN_I.conditions.map(diItem).join('');
    const valueStates = DOMAIN_I.valueContributions.map(item =>
      '<div class="di-item">' + icon('check') + '<div><b>' + esc(item.title) + '</b><span>' + esc(item.text) + '</span></div></div>').join('');
    const characteristics = DOMAIN_I.characteristics.map(item =>
      '<div class="di-item">' + icon('shield') + '<div><b>' + esc(item.title) + '</b><span>' + esc(item.text) + '</span></div></div>').join('');
    const questions = DOMAIN_I.practicalQuestions.map(item =>
      '<div class="di-item">' + icon('list') + '<div><b>' + esc(item.question) + '</b><span>' + esc(item.application) + '</span></div></div>').join('');
    const forms = DOMAIN_I.howValueProvides.map(item =>
      '<div class="di-item">' + icon(item.icon || 'spark') + '<div><b>' + esc(item.title) + '</b><span>' +
      esc(item.text) + ' ' + esc(item.application) + '</span></div></div>').join('');
    const related = DOMAIN_I.relatedTopics.map(item => {
      const links = (item.principles || []).map(num => {
        const found = principleOf(num);
        if (!found) return '';
        const label = 'Principle ' + found.principle.num + ' — ' + found.principle.title;
        return '<a href="standards.html?domain=' + encodeURIComponent(found.domain.id) + '#principle-' + found.principle.num + '">' + esc(label) + '</a>';
      }).join('');
      return '<div class="di-item">' + icon('link') + '<div><b>' + esc(item.topic) + '</b><span class="principle-links">' + links + '</span></div></div>';
    }).join('');
    return '<div class="di">' +
      '<section class="di-statement" id="domain-i-purpose">' +
        '<div class="di-statement-top"><div class="di-ico">' + icon('book') + '</div><div>' +
          '<h2>' + esc(DOMAIN_I.headline) + '</h2>' +
          '<p>' + esc(DOMAIN_I.statement) + '</p></div></div>' +
        '<div class="di-tabs">' +
          '<a class="di-tab on" href="#domain-i-purpose">Purpose statement</a>' +
          '<a class="di-tab" href="#domain-i-practical">Practical application</a>' +
          '<a class="di-tab" href="#domain-i-related">Related Principles</a>' +
        '</div></section>' +
      '<section id="domain-i-value">' +
        '<div class="di-kicker">Forms of Contribution</div>' +
        '<h3>How Internal Auditing Provides Value</h3>' +
        '<div class="di-values">' + value + '</div></section>' +
      '<div class="di-split">' +
        '<section class="di-box" id="domain-i-enhances"><h3>What Internal Auditing Enhances</h3>' + enhances + '</section>' +
        '<section class="di-box" id="domain-i-conditions"><h3>Conditions for Effectiveness</h3>' + conditions +
          '<p class="di-note">' + esc(DOMAIN_I.conditionsNote) + '</p></section>' +
      '</div>' +
      '<section class="di-block" id="domain-i-practical">' +
        '<div class="di-kicker">Domain I</div>' +
        '<h3>Practical Application</h3>' +
        '<p>' + esc(DOMAIN_I.intro) + '</p>' +
        '<p>' + esc(DOMAIN_I.purposeDetail) + '</p>' +
        '<h4>Create, Protect and Sustain Value</h4>' + valueStates +
        '<h4>Essential characteristics</h4>' + characteristics +
        '<h4>Questions to carry into the work</h4>' + questions +
        '<h4>How an engagement contributes</h4>' +
        '<p>' + esc(DOMAIN_I.practicalIllustration) + '</p>' +
        forms +
        '<h4>Illustrative engagement example: Payroll</h4>' +
        '<p>' + esc(DOMAIN_I.payrollExample.intro) + '</p>' +
        '<ul class="rq dot">' + DOMAIN_I.payrollExample.contributions.map(item => '<li><span>' + esc(item) + '</span></li>').join('') + '</ul>' +
        '<p class="di-note">' + esc(DOMAIN_I.payrollExample.note) + '</p>' +
      '</section>' +
      '<section class="di-block" id="domain-i-related">' +
        '<div class="di-kicker">Domain I</div>' +
        '<h3>Related Principles</h3>' +
        related +
        '<p class="di-source">The purpose statement is published by the Institute of Internal Auditors. Read the official text at <a href="' +
          esc(DOMAIN_I.official) + '" target="_blank" rel="noopener noreferrer">theiia.org</a>.</p>' +
      '</section></div>';
  }

  function setChrome(domainI){
    const publicSector = domainI === 'public-sector';
    document.body.classList.toggle('domain-i-page', !!domainI);
    document.body.classList.toggle('public-sector-page', publicSector);
    const crumb = document.querySelector('.crumb');
    const eyebrow = document.querySelector('.page-h .eyebrow');
    const h1 = document.querySelector('.page-h h1');
    const ask = document.getElementById('pageAsk');
    let classification = document.querySelector('.ps-page-note');
    if (publicSector && !classification){
      classification = document.createElement('p');
      classification.className = 'ps-page-note';
      document.querySelector('.page-h').append(classification);
    }
    if (classification) classification.hidden = !publicSector;
    if (publicSector){
      crumb.innerHTML = '<a href="index.html">Home</a><span class="sep">/</span><a href="standards.html">IIA Standards</a><span class="sep">/</span><b>Public Sector Application</b>';
      eyebrow.textContent = 'Public Sector Application';
      h1.textContent = PUBLIC_SECTOR.title;
      lede.textContent = PUBLIC_SECTOR.summary;
      classification.textContent = PUBLIC_SECTOR.classification;
      ask.querySelector('b').textContent = 'Ask about Public Sector Application';
      ask.querySelector('span').textContent = 'Explore how public sector arrangements affect application of the Standards.';
    } else if (domainI){
      crumb.innerHTML = '<a href="index.html">Home</a><span class="sep">/</span><a href="standards.html">IIA Standards</a><span class="sep">/</span><b>Domain I</b>';
      eyebrow.textContent = 'Domain I · Purpose Introduction';
      h1.textContent = DOMAIN_I.title;
      lede.textContent = DOMAIN_I.summary;
      ask.querySelector('b').textContent = 'Explore the purpose of internal auditing';
      ask.querySelector('span').textContent = 'Get support using the platform’s content and guidance.';
    } else {
      crumb.innerHTML = '<a href="index.html">Home</a><span class="sep">/</span><b>IIA Standards</b>';
      eyebrow.textContent = 'Professional framework';
      h1.textContent = 'Global Internal Audit Standards';
      lede.textContent = 'Explore the framework by Domain, Principle and Standard.';
      ask.querySelector('b').textContent = 'Need help finding guidance?';
      ask.querySelector('span').textContent = 'Ask the AI Assistant. It answers from the standards in this platform.';
    }
  }

  function selectPublicSector(id){
    if (!PUBLIC_SECTOR.sections.some(x => x.id === id)) id = 'ps-overview';
    document.querySelectorAll('.public-sector [role="tab"]').forEach(tab => {
      const active = tab.dataset.psTab === id;
      tab.classList.toggle('on', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
    });
    document.querySelectorAll('.public-sector [role="tabpanel"]').forEach(panel => { panel.hidden = panel.id !== id; });
  }

  function markDomainI(){
    const onI = qs('domain') === 'I' && !input.value.trim();
    const current = location.hash || '#domain-i-intro';
    document.querySelectorAll('.di:not(.public-sector) .di-tab').forEach(a => {
      a.classList.toggle('on', onI && a.getAttribute('href') === current);
    });
    document.querySelectorAll('.nav-sec').forEach(a => {
      const href = a.getAttribute('href') || '';
      a.classList.toggle('on', onI && href.indexOf(current) !== -1);
    });
  }

  function domains(){
    setChrome(false);
    const top = DOMAINS.slice(0, 2).map(card).join('');
    const rest = DOMAINS.slice(2).map(card).join('');
    out.innerHTML = '<div class="catalog"><div class="group-label">Explore the five Domains</div>' +
      '<div class="cgrid two">' + top + '</div>' +
      '<div class="cgrid" style="margin-top:14px">' + rest + '</div></div>';
  }

  function domainView(id){
    const d = DOMAINS.find(x => x.id === id);
    if (!d){ domains(); return; }
    if (d.id === 'I'){
      setChrome(true);
      out.innerHTML = '<div class="catalog">' + domainIPanel() + '</div>';
      markDomainI();
      return;
    }
    setChrome(false);
    const wanted = ((location.hash || '').match(/^#principle-(\d+)$/) || [])[1];
    const focus = wanted && d.principles.find(p => String(p.num) === wanted);
    const ordered = focus ? [focus].concat(d.principles.filter(p => p !== focus)) : d.principles;
    if (focus){
      document.querySelector('.page-h h1').textContent = 'Principle ' + focus.num + ' — ' + focus.title;
      lede.textContent = 'Domain ' + d.num + ' — ' + d.name + '. The standards for this principle are listed below.';
      document.title = 'Principle ' + focus.num + ' — ' + focus.title + ' — Audit Intelligence';
      document.querySelector('.crumb').innerHTML =
        '<a href="index.html">Home</a><span class="sep">/</span>' +
        '<a href="standards.html">IIA Standards</a><span class="sep">/</span>' +
        '<a href="standards.html?domain=' + encodeURIComponent(d.id) + '">Domain ' + esc(d.num) + '</a>' +
        '<span class="sep">/</span><b>Principle ' + focus.num + '</b>';
    } else {
      lede.textContent = 'Domain ' + d.num + ' — ' + d.name + '. ' + span(d) + '.';
      document.title = 'Global Internal Audit Standards — Audit Intelligence';
    }
    function principleBlock(p){
      let block = '<div class="group-label" id="principle-' + p.num + '">Principle ' + p.num + ' — ' + esc(p.title) + '</div><div class="cgrid">';
      p.standards.forEach(s => {
        const rec = standardRecord(s.ref);
        block += '<a class="tcard" href="standard.html?ref=' + encodeURIComponent(s.ref) + '">' +
          '<div class="kicker">Standard ' + esc(s.ref) + '</div><h3>' + esc(s.title) + '</h3>' +
          '<p>' + (rec ? esc(cleanSummary(rec.summary)) : 'Open the standard.') + '</p>' +
          '<span class="go">' + (rec ? 'Open standard' : 'View standard') + '</span></a>';
      });
      return block + '</div>';
    }
    let h = '<div class="catalog"><a class="go" href="standards.html" style="font-weight:700;color:var(--navy)">All domains</a>';
    if (focus) h += principleBlock(focus);
    h += '<div class="group-label">Domain ' + esc(d.num) + '</div>';
    h += '<div class="tcard" style="margin-bottom:16px"><div class="kicker">' + esc(span(d)) + '</div>' +
      '<h3>' + esc(d.name) + '</h3><p>' + esc(d.blurb) + '</p></div>';
    ordered.forEach(p => {
      if (focus && p === focus) return;
      h += principleBlock(p);
    });
    out.innerHTML = h + '</div>';
  }

  function run(){
    const q = input.value.trim();
    const url = new URL(location.href);
    const hash = url.hash;
    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
    history.replaceState(null, '', url.pathname + url.search + hash);
    if (!q){
      const domain = qs('domain');
      if (domain === 'public-sector'){
        setChrome('public-sector');
        out.innerHTML = '<div class="catalog">' + publicSectorPanel() + '</div>';
        selectPublicSector((location.hash || '').slice(1));
        return;
      }
      if (domain) domainView(domain); else domains();
      return;
    }
    setChrome(false);
    lede.textContent = 'Results are limited to the standards held in this platform.';
    let res = searchPlatform(q);
    const domainIRes = searchDomainI(q);
    const publicRes = searchPublicSector(q);
    const domain = qs('domain');
    if (domain) res = res.filter(r => r.s.domainId === domain);
    if (!res.length && !(domain === 'I' && domainIRes.length) && !(!domain && domainIRes.length) &&
        !(publicRes.length && (!domain || domain === 'public-sector'))){
      out.innerHTML = '<div class="empty"><b>No results for “' + esc(q) + '”</b>' +
        '<p>Try a keyword, a topic, or a standard number such as 2.2. This search reads the content of the standards, not the internet.</p></div>';
      return;
    }
    let h = '<div class="results">';
    if ((!domain || domain === 'I') && domainIRes.length){
      domainIRes.forEach(r => {
        const src = (r.hits[0] && r.hits[0].text) || r.summary || '';
        h += '<a class="hit" href="standards.html?domain=I' + (r.hits[0] ? '#' + r.hits[0].anchor : '') + '">' +
          '<span class="sref">Domain I</span><h3>' + highlight(r.title, q) + '</h3>' +
          '<p>' + highlight(preview(src, q), q) + '</p></a>';
      });
    }
    if(!domain || domain === 'public-sector')publicRes.forEach(r=>{
      h+='<a class="hit" href="standards.html?domain=public-sector#'+r.anchor+'">'+
        '<span class="sref">Public Sector Application · '+esc(r.label)+'</span><h3>'+esc(r.title)+'</h3>'+
        '<p>'+highlight(preview(r.text,q),q)+'</p></a>';
    });
    res.forEach(r => {
      const s = r.s;
      const href = 'standard.html?ref=' + encodeURIComponent(s.ref) +
        (r.hits[0]?.match ? '&match=' + encodeURIComponent(r.hits[0].match) : '');
      const src = cleanSummary((r.hits[0] && r.hits[0].text) || (r.rec && r.rec.summary));
      h += '<a class="hit" href="' + href + (r.hits[0] ? '#' + r.hits[0].anchor : '') + '">' +
        '<span class="sref">' + esc(s.ref) + (r.hits[0] ? ' · ' + esc(r.hits[0].label) : '') + '</span><h3>' + highlight(s.title, q) + '</h3>' +
        '<p>' + esc('Domain ' + s.domainId + ' · Principle ' + s.principleNum) +
        (src ? ' — ' + highlight(preview(src, q), q) : '') + '</p></a>';
    });
    out.innerHTML = h + '</div>';
  }

  let timer;
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 130); });
  document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); run(); });
  const seed = qs('q');
  if (seed){ input.value = seed; run(); } else run();
  out.addEventListener('click', e => {
    const button = e.target.closest('[data-ps-tab]');
    if (!button || !out.contains(button)) return;
    selectPublicSector(button.dataset.psTab);
  });
  out.addEventListener('keydown', e => {
    const tab = e.target.closest('.public-sector [role="tab"]');
    if (!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    e.preventDefault();
    const tabs = Array.from(out.querySelectorAll('.public-sector [role="tab"]'));
    const i = tabs.indexOf(tab);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 :
      (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    selectPublicSector(tabs[next].dataset.psTab);
    tabs[next].focus();
  });
  function revealTarget(){
    const hash = (location.hash || '').replace(/^#/, '');
    const id = qs('domain') === 'public-sector' && !input.value.trim() ? '' :
      (hash || (qs('domain') === 'I' && !input.value.trim() ? 'domain-i-intro' : ''));
    if (id === 'domain-i-intro'){
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    } else if (id){
      const target = document.getElementById(id);
      if (target){
        const top = target.getBoundingClientRect().top + window.pageYOffset - 84;
        window.scrollTo({ top: Math.max(0, top), left: 0, behavior: 'instant' });
      }
    }
    const scroller = document.getElementById('navBody');
    const row = document.querySelector('.nav-body .pr.open') || document.querySelector('.nav-sec.on');
    if (row && scroller){
      const delta = row.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      if (delta < 8 || delta > scroller.clientHeight - 36) scroller.scrollTop += delta - 12;
    }
  }
  mount({ active:'library' });
  markDomainI();
  revealTarget();
  window.addEventListener('hashchange', () => {
    const domain = qs('domain');
    if (domain === 'public-sector' && !input.value.trim()) selectPublicSector((location.hash || '').slice(1));
    else if (!(domain === 'I' && document.querySelector('.di')) && domain && !input.value.trim()) domainView(domain);
    markDomainI();
    revealTarget();
  });
  window.addEventListener('load', revealTarget);
})();
</script>
</body>
</html>
